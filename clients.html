
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Clients - RoyalMotors</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav>
        <h1>🚗 RoyalMotors</h1>
        <a href="index.html">Accueil</a>
        <a href="voitures.html">Voitures</a>
        <a href="clients.html">Clients</a>
        <a href="ventes.html">Ventes</a>
        <a href="categories.html">Catégories</a>
    </nav>

    <main>
        <h2>👤 Gestion des Clients</h2>

        <form id="form-client">
            <input type="text" id="nom" placeholder="Nom" required>
            <input type="text" id="prenom" placeholder="Prénom" required>
            <input type="email" id="courriel" placeholder="Courriel" required>
            <input type="text" id="telephone" placeholder="Téléphone">
            <button type="submit">Ajouter</button>
        </form>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nom</th>
                    <th>Prénom</th>
                    <th>Courriel</th>
                    <th>Téléphone</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="tableau-clients">
            </tbody>
        </table>
    </main>

    <script src="js/api.js"></script>
    <script src="js/clients.js"></script>
</body>
</html>
